apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: siem
spec:
  serviceName: opensearch
  replicas: 1
  selector:
    matchLabels: {app: opensearch}
  template:
    metadata:
      labels: {app: opensearch}
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.15.0
          env:
            - {name: discovery.type, value: single-node}
          ports:
            - containerPort: 9200
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 50Gi}
